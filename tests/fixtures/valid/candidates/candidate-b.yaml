candidate_statement: >
  This is fixture text standing in for a second candidate statement, written to land inside
  the same word budget the guide applies identically to every candidate in a race. It exists
  only so the validator has something of a realistic length to measure, and so the parity
  check between two candidates in the same race can be exercised by the test suite. It carries
  no meaning and describes no real person, no real office, and no real position on any issue.
  The words here are filler chosen to sit near the other fixture's length without saying
  anything at all, because the point of the fixture is the shape of the record rather than its
  content. Real statements come from the candidate's own campaign materials or from their
  response to this guide's questionnaire, and they are always attributed to a source that a
  reader can open and check for themselves before drawing any conclusion whatsoever.
