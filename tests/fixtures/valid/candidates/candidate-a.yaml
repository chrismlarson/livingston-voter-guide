  meaning and describes no real person, no real office, and no real position on any issue.
  The words here are filler chosen to reach the lower bound of the configured budget without
  saying anything at all, because the point of the fixture is the shape of the record rather
  than its content. Real statements come from the candidate's own campaign materials or from
  their response to this guide's questionnaire, and they are always attributed to a source
  that a reader can open and check for themselves before drawing any conclusion whatsoever.
